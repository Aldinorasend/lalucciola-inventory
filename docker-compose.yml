services:
  mysql:
    image: mysql:8.0
    container_name: lalucciola_inventory
    environment:
      MYSQL_DATABASE: lalucciola_inventory
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: laluciiola_user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
